apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- external-secret.yaml

namespace: team3-matnani-prod

images:
- name: team3-matnani-api
  newName: 495599735720.dkr.ecr.ap-northeast-2.amazonaws.com/team3-matnani-prod-api
  newTag: "9410990"

patches:
- path: ingress-patch.yaml
  target:
    kind: Ingress
    name: matnani-api
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: matnani-api
- path: serviceaccount-patch.yaml
  target:
    kind: ServiceAccount
    name: matnani-api
