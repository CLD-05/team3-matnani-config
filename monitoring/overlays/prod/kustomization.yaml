apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../

patches:
  - path: alertmanager-slack-patch.yaml
    target:
      kind: ExternalSecret
      name: slack-webhook
  - path: alertmanager-slack-patch.yaml
    target:
      kind: AlertmanagerConfig
      name: slack-config
  - path: servicemonitor-patch.yaml
    target:
      kind: ServiceMonitor
      name: matnani-api
